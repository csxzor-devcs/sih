[project]
name = "sih26153"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "torch>=2.1,<3.0",
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "pyarrow>=12.0,<15.0",
    "scikit-learn>=1.3,<2.0",
    "xgboost>=2.0,<3.0",
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
    "pydantic>=2.0,<3.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0,<7.0",
    "prometheus-client>=0.17,<1.0",
    "orjson>=3.9,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
    "pytest-cov>=4.1,<5.0",
    "ruff>=0.1,<1.0",
    "black>=23.0,<25.0",
    "mypy>=1.7,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
